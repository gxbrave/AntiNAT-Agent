name: AntiNAT Agent CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: antinat-agent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.6'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
      - name: Test
        run: GOWORK=off go test ./...
      - name: Race test
        run: GOWORK=off go test -race ./...
      - name: Vet
        run: GOWORK=off go vet ./...
      - name: Build
        run: GOWORK=off make build VERSION=ci COMMIT=${{ github.sha }} DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      - name: Windows cross-build
        run: GOWORK=off make cross-build
